<!DOCTYPE html>
<html lang = "en">
<head>
  <meta charset = "UTF-8">
  <meta name = "viewport"
        content = "width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0" >
  <meta http-equiv = "X-UA-Compatible" content = "ie=edge">
  <link rel="stylesheet" href="./styles/styles.css">
  <title>Zahrada</title>
</head>
<body>
  <header class="header">
    <div class="header__inner container">
      <div class="header__spacer"></div>

      <a class = "header__logo logo" href = "/">
        <img
          src = "./images/logo.svg"
          alt = "Zahrada"
          width = "99" height = "21" loading = "lazy"
        /></a>

      <div class="header__actions hidden-mobile">
        <ul class="header__menu-list">
          <li class="header__menu-item">
            <a class="header__button button button--transparent" href="signup.html">
              Odhlásit se
            </a>
          </li>
        </ul>
      </div>
      <button class = "icon-button visible-mobile" type = "button">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M16 17L21 12M21 12L16 7M21 12H9M12 17C12 17.93 12 18.395 11.8978 18.7765C11.6204 19.8117 10.8117 20.6204 9.77646 20.8978C9.39496 21 8.92997 21 8 21H7.5C6.10218 21 5.40326 21 4.85195 20.7716C4.11687 20.4672 3.53284 19.8831 3.22836 19.1481C3 18.5967 3 17.8978 3 16.5V7.5C3 6.10217 3 5.40326 3.22836 4.85195C3.53284 4.11687 4.11687 3.53284 4.85195 3.22836C5.40326 3 6.10218 3 7.5 3H8C8.92997 3 9.39496 3 9.77646 3.10222C10.8117 3.37962 11.6204 4.18827 11.8978 5.22354C12 5.60504 12 6.07003 12 7" stroke="black" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="visually-hidden">Odhlásit se</span>
      </button>
    </div>
  </header>

  <main class="content">
    <section class="section container">
      <div class = "garden-form">
        <div class="garden-form__header">
          <a href="profil.html" class="garden-form__close cross-button">
            <span class="visually-hidden">Zavřít</span>
          </a>

          <h1 class="garden-form__title h2">Vytvořit novou zahradu</h1>
        </div>

        <form
          action = "#"
          method="post"
          class = "garden-form__body"
        >
          <div class="garden-form__layout">
            <div class="garden-form__aside">
              <div class="upload-box">

                <input
                  class="upload-box__input visually-hidden"
                  type="file"
                  id="garden-photo"
                  name="garden_photo"
                  accept="image/png, image/jpeg"
                  onchange="document.getElementById('preview').src = window.URL.createObjectURL(this.files[0]); document.getElementById('preview').style.opacity = 1;"
                >

                <label class="upload-box__label" for="garden-photo">
                  <img id="preview" class="upload-box__preview" src="#" alt="Náhled" />

                  <span class="upload-box__icon-wrapper">
                     <svg width="48" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12.5 3H7.8C6.11984 3 5.27976 3 4.63803 3.32698C4.07354 3.6146 3.6146 4.07354 3.32698 4.63803C3 5.27976 3 6.11984 3 7.8V16.2C3 17.8802 3 18.7202 3.32698 19.362C3.6146 19.9265 4.07354 20.3854 4.63803 20.673C5.27976 21 6.11984 21 7.8 21H17C17.93 21 18.395 21 18.7765 20.8978C19.8117 20.6204 20.6204 19.8117 20.8978 18.7765C21 18.395 21 17.93 21 17M19 8V2M16 5H22M10.5 8.5C10.5 9.60457 9.60457 10.5 8.5 10.5C7.39543 10.5 6.5 9.60457 6.5 8.5C6.5 7.39543 7.39543 6.5 8.5 6.5C9.60457 6.5 10.5 7.39543 10.5 8.5ZM14.99 11.9181L6.53115 19.608C6.05536 20.0406 5.81747 20.2568 5.79643 20.4442C5.77819 20.6066 5.84045 20.7676 5.96319 20.8755C6.10478 21 6.42628 21 7.06929 21H16.456C17.8951 21 18.6147 21 19.1799 20.7582C19.8894 20.4547 20.4547 19.8894 20.7582 19.1799C21 18.6147 21 17.8951 21 16.456C21 15.9717 21 15.7296 20.9471 15.5042C20.8805 15.2208 20.753 14.9554 20.5733 14.7264C20.4303 14.5442 20.2412 14.3929 19.8631 14.0905L17.0658 11.8527C16.6874 11.5499 16.4982 11.3985 16.2898 11.3451C16.1061 11.298 15.9129 11.3041 15.7325 11.3627C15.5279 11.4291 15.3486 11.5921 14.99 11.9181Z" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                     </svg>
                  </span>
                  <span class="upload-box__text">Přidat fotografii zahrady</span>
                </label>
              </div>
            </div>

            <div class="garden-form__content">
              <div class="field">
                <label for="garden-name" class="field__label visually-hidden">Název zahrady</label>
                <input
                  class="field__input"
                  type="text"
                  id="garden-name"
                  name="gardenName"
                  placeholder="Název zahrady"
                  required
                >
              </div>

              <div class="field">
                <label for="garden-area" class="field__label visually-hidden">Plocha (m2)</label>
                <input
                  class="field__input"
                  type="number"
                  id="garden-area"
                  name="areaSqm"
                  placeholder="Plocha (m2)"
                  min="0"
                >
              </div>

              <div class="field">
                <label for="garden-city" class="field__label visually-hidden">Město</label>
                <input
                  class="field__input"
                  type="text"
                  id="garden-city"
                  name="city"
                  placeholder="Město"
                >
              </div>

              <div class="garden-form__row">
                <div class="field">
                  <label for="garden-street" class="field__label visually-hidden">Ulice</label>
                  <input class="field__input" type="text" id="garden-street" name="street" placeholder="Ulice">
                </div>

                <div class="field">
                  <label for="garden-house" class="field__label visually-hidden">Číslo domu</label>
                  <input class="field__input" type="text" id="garden-house" name="houseNumber" placeholder="Číslo domu">
                </div>

                <div class="field">
                  <label for="garden-zip" class="field__label visually-hidden">PSČ</label>
                  <input class="field__input" type="text" id="garden-zip" name="postalCode" placeholder="PSČ">
                </div>
              </div>

              <button class="button button--green garden-form__submit" type="submit">
                Vytvořit
              </button>
            </div>
          </div>
        </form>
      </div>
    </section>
  </main>

</body>
</html>
