<!DOCTYPE html>
<html lang = "en">
<head>
  <meta charset = "UTF-8">
  <meta name = "viewport"
        content = "width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0" >
  <meta http-equiv = "X-UA-Compatible" content = "ie=edge">
  <link rel="stylesheet" href="./styles/styles.css">
  <title>Login</title>
</head>
<body>
  <header class="header">
  <div class="header__inner container">
    <nav class="header__menu hidden-mobile">
      <ul class="header__menu-list">
        <li class="header__menu-item">
          <a class = "header__menu-link" href = "catalog.html">Aktuální nabídky</a>
        </li>
        <li class="header__menu-item">
          <a class = "header__menu-link" href = "main.html#services">Služby</a>
        </li>
        <li class="header__menu-item">
          <a class = "header__menu-link" href = "aplication.html">Aplikace</a>
        </li>
      </ul>
    </nav>
    <button
      class = "header__burger-menu burger-button visible-mobile"
      type = "button"
      onclick="mobileOverlay.showModal()"
    >
      <span class="visually-hidden">Otevřít hlavní menu</span>
    </button>

    <a class = "header__logo logo" href = "#hero">
      <img
        src = "./images/logo.svg"
        alt = "Zahrada"
        width = "99" height = "21" loading = "lazy"
      /></a>

    <div class="header__actions hidden-mobile">
      <ul class="header__menu-list">
        <li class="header__menu-item">
          <a
            class = "header__menu-link"
            href = "login.html"
          >
            Přihlásit se
          </a>
        </li>
        <li class="header__menu-item">
          <a class="header__button button button--transparent" href="signup.html">
            Registrovat se
          </a>
        </li>
      </ul>
    </div>
    <a class = "icon-button visible-mobile" href="login.html">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M6 17C6 17.93 6 18.395 6.10222 18.7765C6.37962 19.8117 7.18827 20.6204 8.22354 20.8978C8.60504 21 9.07003 21 10 21H16.2C17.8802 21 18.7202 21 19.362 20.673C19.9265 20.3854 20.3854 19.9265 20.673 19.362C21 18.7202 21 17.8802 21 16.2V7.8C21 6.11984 21 5.27976 20.673 4.63803C20.3854 4.07354 19.9265 3.6146 19.362 3.32698C18.7202 3 17.8802 3 16.2 3H10C9.07003 3 8.60504 3 8.22354 3.10222C7.18827 3.37962 6.37962 4.18827 6.10222 5.22354C6 5.60504 6 6.07003 6 7M12 8L16 12M16 12L12 16M16 12H3"
              stroke="currentColor" stroke-width="1.4"
              stroke-linecap="round"
              stroke-linejoin="round"/>
      </svg>
      <span class="visually-hidden">Přihlásit se</span>
    </a>
  </div>
</header>

  <main class="content">
    <section class="section section--login container">
      <div class="section__body">

        <div class="login">
          <div class="login__content">
            <h1 class="login__title h2">Přihlášení</h1>
          </div>

          <form class="login__form" action="#" method="post">

            <div class="login__field field field--transparent">
              <label for = "login-email" class = "field__label visually-hidden">Email</label>
              <input
                class = "field__input"
                id="login-email"
                name="email"
                placeholder="Email"
                type="email"
                required
              />
            </div>

            <div class="login__field field field--transparent">
              <label for = "login-password" class = "field__label visually-hidden">Heslo</label>
              <input
                class = "field__input"
                id="login-password"
                name="password"
                placeholder="Heslo"
                type="password"
                required
              />
            </div>
            
            <div class="login__options">
              <label class = "login__remember checkbox">
                <input class = "checkbox__input" type="checkbox" name = "remember"/>
                <span class="checkbox__text">Pamatovat si mě</span>
              </label>

              <a href="/" class="login__forgot-link">Zapomněli jste heslo?</a>
            </div>

<!--            <button-->
<!--              class = "button button&#45;&#45;green"-->
<!--              type = "submit"-->
<!--            >-->
<!--              Přihlásit se-->
<!--            </button>-->
            <a
              class = "button button--green"
              href = "profil.html"
            >
              Přihlásit se
            </a>
          </form>

          <div class="login__footer">
            <p class="login__footer-text">
              Nemáte účet?
              <a class="login__footer-link" href="signup.html">Registrovat se</a>
            </p>
          </div>

        </div>
      </div>
    </section>
  </main>

  <dialog class="mobile-overlay visible-mobile" id="mobileOverlay">
        <form class = "mobile-overlay__close-button-wrapper" method="dialog">
            <button
                class = "mobile-overlay__close-button cross-button"
                type = "submit"
            >
                <span class="visually-hidden">Zavřít hlavní menu</span>
            </button>
        </form>
        
        <div class="mobile-overlay__body">
            <ul class="mobile-overlay__list">
                <li class="mobile-overlay__item">
                    <a class = "mobile-overlay__link" href = "catalog.html">Aktuální nabídky</a>
                </li>
                <li class="mobile-overlay__item">
                    <a class = "mobile-overlay__link" href = "main.html#services">Služby</a>
                </li>
                <li class="mobile-overlay__item">
                    <a class = "mobile-overlay__link" href = "aplication.html">Aplikace</a>
                </li>
            </ul>
        </div>
  </dialog>
  
</body>
</html>
